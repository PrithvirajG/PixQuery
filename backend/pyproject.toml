[project]
name = "pixquery-backend"
version = "0.1.0"
description = "Backend for PixQuery"
requires-python = ">=3.10"
dependencies = [
    "aio-pika==9.4.3",
    "pymongo==4.7.3",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "watchdog==2.1.9",
]
worker = [
    "torch>=2.9.0",
    "torchvision",
    "ultralytics>=8.3,<8.4",
    "clip @ git+https://github.com/openai/CLIP.git",
    "transformers==4.52.4",
    "pillow>=10.0.0",
]
monitor = [
    "watchdog==2.1.9",
]

[dependency-groups]
dev = [
    "pixquery-backend[api,worker,monitor]",
]

[project]
name = "pixquery-backend"
version = "0.1.0"
description = "Backend for PixQuery"
requires-python = ">=3.10"
dependencies = [
    "aio-pika==9.4.3",
    "pymongo==4.7.3",
    "pydantic>=2.7,<3",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "watchdog==2.1.9",
]
pipeline-worker = [
    # Pinned as a matched pair — torch/torchvision aren't independently
    # versioned, and an unpinned torchvision let the resolver pick a release
    # too old to have a wheel on the Windows CUDA index (see tool.uv.sources
    # below), even though it satisfied every other constraint.
    "torch==2.13.0",
    "torchvision==0.28.0",
    "ultralytics>=8.3,<8.4",
    "clip @ git+https://github.com/openai/CLIP.git",
    "transformers==4.52.4",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    # Face detection backends: SCRFD (insightface on onnxruntime) and
    # RetinaFace-R50 (batch-face). YuNet needs only opencv, already via ultralytics.
    "insightface>=2.0",
    "onnxruntime>=1.20",
    "batch-face>=1.5",
    # Moondream2 (Vision Language Model node) needs this for its custom
    # modeling code; Qwen2-VL needs no new deps beyond transformers/torch.
    "einops>=0.7",
]
file-watcher = [
    "watchdog==2.1.9",
]

[dependency-groups]
dev = [
    "pixquery-backend[api,pipeline-worker,file-watcher]",
    "coverage>=7.6",
]

# CUDA-enabled torch/torchvision on Windows only — PyPI's own wheels are CPU-only
# there (unlike the historical default). Docker/Linux stays on the default PyPI
# (CPU) index deliberately: docker-compose.yml doesn't pass a GPU through to the
# pipeline-worker container, so pulling a ~2.4GB CUDA wheel there would only slow
# builds without ever being used.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 83

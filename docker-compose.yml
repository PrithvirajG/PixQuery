networks:
  pixquery_net:
    external: true
    name: pixquery_net

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixquery-api
    command: uvicorn api_main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ${PIXQUERY_PHOTOS:-~/pixquery_photos}:/data/photos
    environment:
      PYTHONPATH: /app
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: pixquery
      RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      RABBITMQ_QUEUE: image_task
      WEAVIATE_URL: http://weaviate:8080
      WATCH_ROOT: /data/photos
    networks:
      - pixquery_net

  ingestor:
    build:
      context: ./backend
      dockerfile: Dockerfile.monitor
    container_name: pixquery-ingestor
    command: python monitoring_main.py
    volumes:
      - ./backend:/app
      - ${PIXQUERY_PHOTOS:-~/pixquery_photos}:/data/photos
    environment:
      PYTHONPATH: /app
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: pixquery
      RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      RABBITMQ_QUEUE: image_task
      WATCH_ROOT: /data/photos
      WATCH_ROOT_ID: local_photos
    networks:
      - pixquery_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: pixquery-worker
    command: python worker_main.py
    volumes:
      - ./backend:/app
      - ${PIXQUERY_PHOTOS:-~/pixquery_photos}:/data/photos
    environment:
      PYTHONPATH: /app
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: pixquery
      RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      RABBITMQ_QUEUE: image_task
      WEAVIATE_URL: http://weaviate:8080
      WATCH_ROOT: /data/photos
    networks:
      - pixquery_net

  frontend:
    image: node:20
    container_name: pixquery-frontend
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    networks:
      - pixquery_net

networks:
  pixquery_net:
    name: pixquery_net

volumes:
  mongodb_data:
  weaviate_data:

services:
  mongodb:
    image: mongo:7
    container_name: pixquery-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pixquery_net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pixquery-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - pixquery_net
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.25.5
    container_name: pixquery-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - pixquery_net
    restart: unless-stopped
